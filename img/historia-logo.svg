<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="parch" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#f1e4bc"/>
      <stop offset="100%" stop-color="#d8c58e"/>
    </radialGradient>
  </defs>

  <!-- Outer disc: oxblood field -->
  <circle cx="256" cy="256" r="248" fill="#7a2e1f"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#9c6f22" stroke-width="10"/>

  <!-- Inner parchment disc -->
  <circle cx="256" cy="256" r="206" fill="url(#parch)" stroke="#9c6f22" stroke-width="6"/>
  <circle cx="256" cy="256" r="188" fill="none" stroke="#5a4527" stroke-width="2" opacity="0.5"/>

  <!-- Compass rose: 8 gold points, main 4 longer -->
  <g stroke="#9c6f22" stroke-width="3" stroke-linejoin="round">
    <!-- cardinal points (N/E/S/W), longer -->
    <polygon points="256,84 274,238 256,256 238,238" fill="#7a2e1f"/>
    <polygon points="256,84 238,238 256,256 274,238" fill="#3a2c1a"/>

    <polygon points="428,256 274,238 256,256 274,274" fill="#7a2e1f"/>
    <polygon points="428,256 274,274 256,256 274,238" fill="#3a2c1a"/>

    <polygon points="256,428 238,274 256,256 274,274" fill="#7a2e1f"/>
    <polygon points="256,428 274,274 256,256 238,274" fill="#3a2c1a"/>

    <polygon points="84,256 238,274 256,256 238,238" fill="#7a2e1f"/>
    <polygon points="84,256 238,238 256,256 238,274" fill="#3a2c1a"/>

    <!-- intercardinal points (NE/SE/SW/NW), shorter -->
    <polygon points="366,146 268,244 256,256 264,232" fill="#9c6f22"/>
    <polygon points="366,146 264,232 256,256 244,264" fill="#5a4527"/>

    <polygon points="366,366 248,264 256,256 232,248" fill="#9c6f22"/>
    <polygon points="366,366 232,248 256,256 244,264" fill="#5a4527"/>

    <polygon points="146,366 244,268 256,256 248,280" fill="#9c6f22"/>
    <polygon points="146,366 248,280 256,256 268,264" fill="#5a4527"/>

    <polygon points="146,146 264,248 256,256 280,264" fill="#9c6f22"/>
    <polygon points="146,146 280,264 256,256 268,244" fill="#5a4527"/>
  </g>

  <!-- center medallion -->
  <circle cx="256" cy="256" r="20" fill="#f1e4bc" stroke="#7a2e1f" stroke-width="4"/>
  <circle cx="256" cy="256" r="7" fill="#7a2e1f"/>

  <!-- small fleur/star tip at true North for orientation flavor -->
  <path d="M256 60 L262 82 L256 84 L250 82 Z" fill="#9c6f22"/>
</svg>
