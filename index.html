<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg" href="img/historia-logo.svg" />
  <title>Historia</title>
  <!-- Polices Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=IM+Fell+English&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Ton CSS -->
  <link rel="stylesheet" href="src/styles.css">
  <!-- CSS pour le style médiéval de Leaflet -->
  <style>
    /* Style médiéval pour Leaflet */
    .leaflet-container {
      background: var(--parch1);
      font-family: var(--serif-body);
    }
    .leaflet-bar a {
      background-color: var(--parch2);
      color: var(--ink);
      border: 1px solid var(--gold);
    }
    .leaflet-bar a:hover {
      background-color: var(--parch-dark);
    }
    .leaflet-control-zoom-in,
    .leaflet-control-zoom-out {
      background-color: var(--parch2);
      color: var(--ink-soft);
      border: 1px solid var(--gold);
    }
    .leaflet-control-zoom-in:hover,
    .leaflet-control-zoom-out:hover {
      background-color: var(--parch-dark);
    }
    .leaflet-popup {
      background: var(--parch2);
      color: var(--ink);
      border: 2px solid var(--gold);
      font-family: var(--serif-body);
    }
    .leaflet-popup-content {
      margin: 10px;
    }
    .leaflet-popup-content-wrapper {
      background: transparent;
    }
    /* Cache les attribions Leaflet (optionnel) */
    .leaflet-control-attribution {
      display: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="frame">
      <header>
        <h1>Historia</h1>
        <p>Chronica orbis terrarum topographica</p>
        <div id="mode-row"></div>
        <div id="legend-row"></div>
      </header>
      <div id="main">
        <!-- Conteneur pour Leaflet -->
        <div id="map-wrap">
          <div id="map" style="height: 100%; width: 100%;"></div>
          <p id="empty-hint">Click on a region or a point to see details.</p>
        </div>
        <aside id="panel">
          <div id="panel-inner">
            <button id="panel-back">← back</button>
            <button id="panel-close">✕ close</button>
            <div id="panel-body"></div>
          </div>
        </aside>
      </div>
      <div id="timeline">
        <div id="timeline-top">
          <div id="year-display">Anno <span id="year-num">1000</span></div>
          <button id="play-btn">▶ ab -2000 ad 2000</button>
        </div>
        <input type="range" id="year-slider" min="-2000" max="2000" step="50" value="0">
        <div id="ticks"><span>-2000</span><span>-1500</span><span>-1000</span><span>-500</span><span>0</span><span>500</span><span>1000</span><span>1500</span><span>2000</span></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
