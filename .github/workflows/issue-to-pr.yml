name: Turn an event proposal into a Pull Request

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-event-pr:
    if: contains(github.event.issue.labels.*.name, 'event')
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Parse the form
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python scripts/issue_to_event.py

      - name: Validate the data
        run: |
          python -m pip install jsonschema
          python scripts/validate_data.py

      - name: Create the Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add event from issue #${{ github.event.issue.number }}"
          branch: "contribution/event-${{ github.event.issue.number }}"
          delete-branch: true
          title: "Add a historical event — #${{ github.event.issue.number }}"
          body: |
            ## Proposal from issue #${{ github.event.issue.number }}

            This Pull Request was generated automatically from the GitHub form.

            - Issue: #${{ github.event.issue.number }}
            - Proposed by: @${{ github.event.issue.user.login }}

            ### Checks
            - JSON schema validation: OK
            - Territory matches a known political entity: OK

            Please review the historical content and sources before merging.
          labels: "contribution,event"

      - name: Comment on the issue
        if: steps.create_pr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = ${{ steps.create_pr.outputs.pull-request-number }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Thank you! Your proposal was automatically turned into Pull Request #${pr}. A maintainer will now review the historical content and sources.`
            });
