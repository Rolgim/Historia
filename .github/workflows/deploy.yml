name: Deploy the site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Grants the permissions needed for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allows only one deployment to run at a time
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Point this at the site root, or a subfolder if the site
          # isn't served from the repository root.
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
